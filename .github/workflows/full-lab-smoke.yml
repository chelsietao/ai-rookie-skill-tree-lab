name: full-lab-smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[full,dev]'
      - run: python scripts/reproduce_all.py --profile ci

