[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rookie-skill-tree-lab"
version = "1.0.0"
description = "A CPU-first, evidence-backed lab covering the SinoPac Turing Plan AI rookie skill tree."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Chelsie Tao"}]
dependencies = [
  "fastapi>=0.116,<1",
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "torch>=2.6,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
full = [
  "catboost>=1.2,<2",
  "imbalanced-learn>=0.13,<1",
  "optuna>=4.4,<5",
  "pymysql>=1.1,<2",
  "tensorboard>=2.19,<3",
  "tensorflow>=2.19,<3",
  "transformers>=4.52,<6",
  "umap-learn>=0.5,<1",
  "xgboost>=3.0,<4",
]
dev = [
  "httpx>=0.28,<1",
  "ipykernel>=6,<8",
  "mypy>=1.16,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
rookie-lab = "rookie_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
